<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration sheet: target</title></head><body style="background:#123;color:#fff;font:20px sans-serif;padding:20px">
<h1>target page</h1><p>reached from <a href="lab.html" style="color:#9cf">lab.html</a></p>
<script src="report.js"></script>
<script>
// a heartbeat, and a hello on every show: Back/Forward restore this page
// from Safari's page cache without running it again
function hello(){ if (!document.hidden) Sheet.send('type=hello&page=target&vw=' + innerWidth + '&vh=' + innerHeight); }
hello();
setInterval(hello, 2000);
addEventListener('pageshow', function(e){ if (e.persisted) hello(); });
addEventListener('pagehide', function(){ Sheet.beacon('type=bye&page=target'); });
document.addEventListener('visibilitychange', function(){ if (document.hidden) Sheet.beacon('type=bye&page=target'); else hello(); });
</script></body></html>
